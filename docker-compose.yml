services:
  backend:
    build:
      context: ./backend
    container_name: recetas_backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/recetas.db
      UPLOAD_DIR: /app/uploads
      BACKEND_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    container_name: recetas_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
